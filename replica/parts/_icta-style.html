<style>
/* ============ ICT学院频道页样式 ============ */
.icta-banner img { width: 100%; display: block; }

/* 三类角色入口条（浅灰底三栏） */
.role-strip { background: #f2f3f5; padding: 26px 0; }
.role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.role-item { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; }
.role-name { font-size: 20px; font-weight: 700; color: var(--ink); }
.role-sub { font-size: 13px; color: var(--text-3); margin-top: 6px; }
.role-btn { display: inline-block; margin-top: 14px; font-size: 13px; color: var(--hw-red); border: 1px solid var(--hw-red); border-radius: 4px; padding: 6px 18px; }
.role-btn:hover { background: var(--hw-red); color: #fff; }

/* 5 快捷卡 */
.quick-section { padding: 44px 0 36px; background: var(--white); }
.quick-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
.quick-card { border: 1px solid var(--line); border-radius: 8px; padding: 22px 16px 18px; text-align: center; transition: box-shadow .2s; }
.quick-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.quick-card img { width: 44px; height: 44px; margin: 0 auto 10px; object-fit: contain; }
.qk-name { font-size: 17px; font-weight: 600; color: var(--ink); }
.qk-sub { font-size: 12px; color: var(--text-3); margin-top: 6px; }

/* 数据统计条 */
.stats-band { background: var(--white); border-top: 1px solid var(--line); padding: 34px 0; }
.stats-grid { display: flex; justify-content: space-between; }
.stat-item { display: flex; align-items: center; gap: 14px; }
.stat-item img { width: 46px; height: 46px; object-fit: contain; }
.st-num { font-size: 30px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.15; }
.st-label { font-size: 13px; color: var(--text-3); }

/* 简介区（左文右视频） */
.intro-section { background: var(--gray-bg); padding: 64px 0; }
.intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.intro-kicker { font-size: 13px; font-weight: 700; letter-spacing: .22em; color: var(--hw-red); }
.intro-left h2 { font-size: 34px; font-weight: 700; color: var(--ink); margin-top: 8px; }
.intro-tagline { font-size: 17px; color: var(--text-2); margin: 10px 0 16px; }
.intro-text { font-size: 14.5px; color: var(--text-2); line-height: 1.9; text-align: justify; }
.intro-btns { display: flex; gap: 16px; margin-top: 26px; }
.btn-red { background: var(--hw-red); color: #fff; font-size: 14px; border-radius: 4px; padding: 10px 26px; }
.btn-red:hover { background: var(--hw-red-press); }
.intro-video .video-poster { position: relative; height: 300px; background: #eceef1; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.intro-video .video-poster img { width: 64px; height: 64px; opacity: .95; }

/* 通用区块标题 */
.sec-title { text-align: center; font-size: 30px; font-weight: 700; color: var(--ink); }
.adv-section { background: var(--white); padding: 64px 0 56px; }
.adv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; margin-top: 40px; }
.adv-card { text-align: center; padding: 0 10px; }
.adv-card svg { width: 52px; height: 52px; margin: 0 auto 14px; }
.adv-card h3 { font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.adv-card p { font-size: 13.5px; color: var(--text-2); line-height: 1.8; text-align: center; }

/* IASC */
.iasc-section { background: var(--gray-bg); padding: 60px 0 52px; }
.iasc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; margin-top: 38px; }
.iasc-card { background: var(--white); border-radius: 8px; padding: 26px 18px 22px; text-align: center; }
.iasc-icon { display: inline-flex; width: 52px; height: 52px; background: var(--hw-red); border-radius: 10px; align-items: center; justify-content: center; margin-bottom: 12px; }

.iasc-card h3 { font-size: 17px; font-weight: 600; color: var(--ink); }
.iasc-card p { font-size: 13px; color: var(--text-2); margin-top: 8px; line-height: 1.7; }
.iasc-btn-row { text-align: center; margin-top: 30px; }
.btn-ghost { display: inline-block; border: 1px solid var(--text-2); color: var(--text); font-size: 14px; border-radius: 4px; padding: 9px 30px; background: var(--white); }

/* 成功案例（左1大右2小） */
.icta-stories { background: var(--white); padding: 60px 0 56px; }
.sec-head-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; }
.sec-title-block .sec-title { text-align: left; }
.sec-sub { font-size: 14px; color: var(--text-3); margin-top: 4px; letter-spacing: .12em; }
.more-link { color: var(--hw-red); font-size: 14px; }
.story-feature-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
.story-side { display: grid; grid-template-rows: 1fr 1fr; gap: 20px; }
.story-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.story-feat, .story-sm { display: block; border-radius: 8px; overflow: hidden; position: relative; background: var(--gray-bg); }
.story-feat { height: 320px; }
.story-sm { height: 150px; }
.sf-cover { position: absolute; inset: 0; }
.ph-1 { background: #e4e7eb; }
.ph-2 { background: #e8eaed; }
.ph-3 { background: #e6e8ea; }
.ph-4 { background: #e5e7ea; }
.ph-5 { background: #e7e9eb; }
.sf-title { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 14px; line-height: 1.5; padding: 10px 16px; }
.load-more-row { text-align: center; margin-top: 28px; }

/* 加入我们 */
.join-section { background: var(--gray-bg); padding: 60px 0 70px; }
.join-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 38px; }
.join-card { background: var(--white); border: 1px solid var(--line); border-radius: 8px; padding: 30px 28px 26px; text-align: left; }
.join-card h3 { font-size: 19px; font-weight: 700; color: var(--ink); }
.join-card p { font-size: 13.5px; color: var(--text-2); margin-top: 10px; line-height: 1.75; min-height: 48px; }
.join-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--text); border: 1px solid var(--text-2); border-radius: 999px; padding: 8px 22px; }
.join-btn::after { content: '→'; color: var(--hw-red); }
.join-btn:hover { border-color: var(--hw-red); color: var(--hw-red); }
</style>
