<style>
/* ============ 课程详情页样式（ict-academy 子应用布局） ============ */
.cd-crumb { background: var(--white); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--text-3); padding: 12px 0; }
.cd-crumb .cur { color: var(--text); }

.cd-hero { background: linear-gradient(180deg, #f2f4f8, #fff); padding: 34px 0 38px; }
.cd-hero-grid { display: grid; grid-template-columns: 460px 1fr; gap: 40px; align-items: stretch; }
.cd-cover { position: relative; height: 240px; border-radius: 10px; background: linear-gradient(135deg, #dfe6f2, #c6d4ea); overflow: hidden; padding: 24px; }
.cd-cover-mark { position: absolute; right: 26px; bottom: 22px; width: 84px; height: 84px; background: #fff; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: var(--hw-red); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.cd-cover-name { font-size: 30px; font-weight: 700; color: #1c2b3a; line-height: 1.4; }
.cd-title-row { display: flex; align-items: flex-start; justify-content: space-between; }
.cd-info h1 { font-size: 28px; font-weight: 700; color: var(--ink); line-height: 1.35; }
.cd-share { position: relative; font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line-input); border-radius: 4px; flex: none; cursor: pointer; }
.cd-share-pop { display: none; position: absolute; top: 36px; right: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.1); padding: 10px 16px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.cd-share:hover .cd-share-pop { display: block; }
.cd-meta { display: flex; gap: 34px; flex-wrap: wrap; margin-top: 22px; }
.cm .k { display: block; font-size: 12.5px; color: var(--faint); }
.cm .v { display: block; font-size: 15px; color: var(--text); margin-top: 4px; font-weight: 600; }
.cd-go { margin-top: 28px; background: var(--hw-red); color: #fff; font-size: 15px; border-radius: 4px; padding: 12px 44px; letter-spacing: .1em; }
.cd-go:hover { background: var(--hw-red-press); }

.cd-main { background: var(--page-bg); padding: 28px 0 64px; }
.cd-main-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
.cd-card { background: var(--white); border-radius: 8px; padding: 24px 28px; }
.cd-left .cd-card + .cd-card { margin-top: 20px; }
.cd-card h2 { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 14px; padding-left: 12px; border-left: 4px solid var(--hw-red); }
.cd-card p { font-size: 14px; color: var(--text-2); line-height: 1.95; text-align: justify; }
.ct-node { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--text); padding: 11px 6px; border-bottom: 1px solid var(--gray-bg); cursor: pointer; }
.ct-node:last-child { border-bottom: none; }
.ct-node:hover { color: var(--hw-red); }
.ct-caret { width: 0; height: 0; border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent; border-left: 6px solid #b9bcc2; }
.cd-ability { background: var(--gray-bg); border-radius: 8px; padding: 22px 26px; margin-top: 20px; }
.cd-ability h2 { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
.cd-ability p { font-size: 14px; color: var(--text-2); line-height: 1.9; }
.cd-rolefork { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.rf-card { background: var(--white); border-radius: 8px; padding: 22px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rf-name { font-size: 17px; font-weight: 700; color: var(--ink); }
.rf-btns { display: flex; gap: 10px; }
.rf-btn { font-size: 13.5px; border-radius: 4px; padding: 8px 20px; }
.rf-btn.outline { border: 1px solid var(--hw-red); color: var(--hw-red); background: #fff; }
.rf-btn.solid { background: var(--hw-red); color: #fff; border: 1px solid var(--hw-red); }
.rf-btn.solid:hover { background: var(--hw-red-press); }
.cd-card.team .tm { display: flex; gap: 14px; }
.tm-avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #d7dee8, #b9c4d4); flex: none; }
.tm-name { font-size: 16px; font-weight: 600; color: var(--ink); }
.tm-title { font-size: 12.5px; color: var(--text-2); margin-top: 5px; line-height: 1.6; }
</style>
