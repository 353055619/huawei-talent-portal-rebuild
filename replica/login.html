<!doctype html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>华为账号登录（复刻）</title>
<style>
/* uniportal.huawei.com 华为账号登录页 · 独立系统（无人才在线壳） */
:root {
  --hw-red: #c7000b; --ink: #000; --text: #333; --text-2: #595959; --text-3: #666;
  --line-input: #ddd; --page-bg: #f5f5f5; --blue: #007dff;
  --font: 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--page-bg); color: var(--text); font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font: inherit; border: none; background: none; cursor: pointer; }

/* 顶栏：logo + 语言 */
.un-top { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; }
.hw-logo { display: flex; align-items: center; gap: 10px; }
.hw-logo .petal { display: grid; grid-template-columns: repeat(2, 11px); grid-template-rows: repeat(2, 15px); gap: 2px; }
.hw-logo .petal i { background: var(--hw-red); border-radius: 0 60% 60% 60%; transform: rotate(45deg); }
.hw-logo .petal i:nth-child(1) { transform: rotate(-15deg) skewY(-8deg); }
.hw-logo .petal i:nth-child(2) { transform: rotate(15deg) skewY(8deg); }
.hw-logo .petal i:nth-child(3) { transform: rotate(15deg) skewY(8deg) scale(-1, 1); }
.hw-logo .petal i:nth-child(4) { transform: rotate(-15deg) skewY(-8deg) scale(-1, 1); }
.hw-logo .word { font-weight: 700; font-size: 21px; letter-spacing: .08em; color: var(--ink); }
.lang-sel { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); border: 1px solid var(--line-input); background: #fff; border-radius: 3px; padding: 5px 12px; }
.lang-sel::after { content: ''; width: 0; height: 0; border-top: 4px solid var(--text-2); border-left: 4px solid transparent; border-right: 4px solid transparent; }

/* 登录卡 */
.un-main { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding-top: 26px; }
.login-card { width: 460px; background: #fff; padding: 44px 44px 36px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.login-card h1 { font-size: 22px; font-weight: 700; color: var(--ink); text-align: left; }
.login-hint { font-size: 13px; color: var(--text-3); margin: 10px 0 26px; }
.field { margin-bottom: 18px; }
.field input { width: 100%; height: 42px; border: 1px solid var(--line-input); border-radius: 4px; padding: 0 12px; font-size: 14px; color: var(--text); outline: none; }
.field input:focus { border-color: var(--blue); }
.field.pwd { position: relative; }
.field.pwd .eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #999; cursor: pointer; display: inline-flex; }
.sms-link { display: block; font-size: 13px; color: var(--blue); margin: 2px 0 22px; }
.login-btn { width: 100%; height: 42px; background: #e8808c; color: #fff; border-radius: 4px; font-size: 15px; letter-spacing: .2em; transition: background .2s; }
.login-btn:hover { background: var(--hw-red); }
.login-links { display: flex; justify-content: center; gap: 28px; margin-top: 22px; font-size: 13px; color: var(--text-2); }
.login-links a:hover { color: var(--blue); }

/* Cookie 条 */
.un-cookie { background: #eaf3fc; display: flex; align-items: center; gap: 8px; padding: 0 40px; height: 44px; font-size: 12.5px; color: var(--text); }
.un-cookie .info { color: var(--blue); font-style: normal; }
.un-cookie a { color: var(--blue); }
.un-cookie .close-x { margin-left: auto; border: 1px solid #bbb; color: #666; width: 18px; height: 18px; line-height: 16px; text-align: center; font-size: 11px; background: #fff; border-radius: 2px; }

/* 页脚 */
.un-footer { background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-between; padding: 14px 40px; font-size: 12px; color: #999; }
.un-footer .links { display: flex; gap: 18px; }
</style>
</head>
<body>
<div class="un-top">
  <a class="hw-logo" aria-label="华为">
    <span class="petal" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="word">HUAWEI</span>
  </a>
  <button class="lang-sel">简体中文(中国)</button>
</div>

<div class="un-main">
  <div class="login-card">
    <h1>华为账号登录</h1>
    <p class="login-hint">您可使用以下方式登录：</p>
    <div class="field">
      <input type="text" placeholder="手机号/邮件地址/账号名" aria-label="手机号/邮件地址/账号名" />
    </div>
    <div class="field pwd">
      <input type="password" placeholder="密码" aria-label="密码" />
      <span class="eye" aria-label="显示密码">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M2.5 10S5.8 4.5 10 4.5 17.5 10 17.5 10 14.2 15.5 10 15.5 2.5 10 2.5 10z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
    </div>
    <a class="sms-link">短信验证码登录</a>
    <button class="login-btn">登录</button>
    <div class="login-links"><a>注册</a><a>忘记密码</a></div>
  </div>
</div>

<div class="un-cookie">
  <i class="info">ℹ</i>
  本网站使用 Cookie 功能，为您提供最佳的用户体验。
  <a>了解更多</a>
  <button class="close-x" aria-label="关闭">✕</button>
</div>

<footer class="un-footer">
  <span>版权所有 © 华为技术有限公司 1998-2026。保留一切权利。粤A2-20044005号</span>
  <span class="links"><a>联系我们</a><a>隐私政策</a><a>Cookies</a></span>
</footer>
</body>
</html>
<!-- REPLICA-NOTE: uniportal 登录页独立复刻（无人才在线壳）；登录按钮初始态为浅红 #e8808c（现网未输入时态），hover 深华为红 -->
